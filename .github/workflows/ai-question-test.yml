name: PyHok AI Knowledge Generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r generator/requirements.txt

      - name: Generate proposal with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: python generator/generate_question.py

      - name: Locate generated question
        id: question
        run: |
          FILE=$(find generator/output/questions \
            -maxdepth 1 \
            -type f \
            -name 'q_*.json' \
            -printf '%T@ %p\n' \
            | sort -n \
            | tail -n 1 \
            | cut -d' ' -f2-)

          test -n "$FILE"

          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Validate question
        env:
          QUESTION_FILE: ${{ steps.question.outputs.file }}
        run: |
          python validators/validate_question.py "$QUESTION_FILE"

      - name: Publish question
        env:
          QUESTION_FILE: ${{ steps.question.outputs.file }}
        run: |
          cp "$QUESTION_FILE" "data/questions/$(basename "$QUESTION_FILE")"

          git config user.name "PyHok Knowledge Agent"
          git config user.email "actions@github.com"

          git add data/questions/$(basename "$QUESTION_FILE")

          git commit -m "ai: publish validated question"
          git push
