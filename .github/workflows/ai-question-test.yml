name: AI Question Generator Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-question:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r generator/requirements.txt

      - name: Generate structured hypothesis with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: python generator/generate_question.py

      - name: Repository engine test
        run: python tests/engine/run_engine_test.py

      - name: Locate generated question
        id: generated
        run: |
          FILE=$(find generator/output/questions \
            -maxdepth 1 \
            -type f \
            -name 'q_*.json' \
            -printf '%T@ %p\n' \
            | sort -n \
            | tail -n 1 \
            | cut -d' ' -f2-)

          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Final canonical validation
        env:
          QUESTION_FILE: ${{ steps.generated.outputs.file }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft7Validator

          question = json.loads(
              Path(os.environ["QUESTION_FILE"])
              .read_text(encoding="utf-8")
          )

          schema = json.loads(
              Path("schemas/v2/question.schema.json")
              .read_text(encoding="utf-8")
          )

          errors = sorted(
              Draft7Validator(schema).iter_errors(question),
              key=lambda error: list(error.path)
          )

          if errors:
              print("FINAL VALIDATION: FAILED")

              for error in errors:
                  print("-", error.message)

              raise SystemExit(1)

          print("FINAL VALIDATION: PASSED")
          PY

      - name: Show approved hypothesis
        env:
          QUESTION_FILE: ${{ steps.generated.outputs.file }}
        run: cat "$QUESTION_FILE"

      - name: Commit approved hypothesis
        env:
          QUESTION_FILE: ${{ steps.generated.outputs.file }}
        run: |
          git config user.name "PyHok Agent Generator"
          git config user.email "actions@github.com"

          git add "$QUESTION_FILE"

          if git diff --cached --quiet; then
            echo "No new hypothesis to commit."
            exit 0
          fi

          git commit -m "ai: generate observational hypothesis"
          git push
