name: AI Question Generator Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-question:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r generator/requirements.txt jsonschema

      - name: Generate hypothesis with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: python generator/generate_question.py

      - name: Locate generated question
        id: generated
        run: |
          FILE=$(find generator/output/questions \
            -maxdepth 1 \
            -type f \
            -name 'q_*.json' \
            -printf '%T@ %p\n' \
            | sort -n \
            | tail -n 1 \
            | cut -d' ' -f2-)

          if [ -z "$FILE" ]; then
            echo "No generated question found."
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Generated: $FILE"

      - name: Validate Question Schema
        env:
          QUESTION_FILE: ${{ steps.generated.outputs.file }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft7Validator

          question_path = Path(os.environ["QUESTION_FILE"])
          schema_path = Path("schemas/v2/question.schema.json")

          question = json.loads(
              question_path.read_text(encoding="utf-8")
          )

          schema = json.loads(
              schema_path.read_text(encoding="utf-8")
          )

          validator = Draft7Validator(schema)
          errors = sorted(
              validator.iter_errors(question),
              key=lambda e: list(e.path)
          )

          if errors:
              print("QUESTION SCHEMA VALIDATION: FAILED")
              for error in errors:
                  print("-", error.message)
              raise SystemExit(1)

          print("QUESTION SCHEMA VALIDATION: PASSED")
          PY

      - name: Validate Signal References
        env:
          QUESTION_FILE: ${{ steps.generated.outputs.file }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          question = json.loads(
              Path(os.environ["QUESTION_FILE"]).read_text(
                  encoding="utf-8"
              )
          )

          available = set()

          for path in Path("data/signals").glob("*.json"):
              signal = json.loads(
                  path.read_text(encoding="utf-8")
              )
              available.add(signal["id"])

          errors = []

          for signal_id in question["required_signals"]:
              if signal_id not in available:
                  errors.append(
                      f"Unknown required signal: {signal_id}"
                  )

          for rule in question["evaluation_trigger"]["rules"]:
              signal_id = rule["signal_id"]

              if signal_id not in available:
                  errors.append(
                      f"Unknown trigger signal: {signal_id}"
                  )

          if errors:
              print("SIGNAL REFERENCE VALIDATION: FAILED")
              for error in errors:
                  print("-", error)
              raise SystemExit(1)

          print("SIGNAL REFERENCE VALIDATION: PASSED")
          PY

      - name: Validate Evaluation Method
        env:
          QUESTION_FILE: ${{ steps.generated.outputs.file }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          question = json.loads(
              Path(os.environ["QUESTION_FILE"]).read_text(
                  encoding="utf-8"
              )
          )

          methods = json.loads(
              Path("generator/methods/methods.json").read_text(
                  encoding="utf-8"
              )
          )

          known = {
              method["method_id"]: method["version"]
              for method in methods["methods"]
          }

          evaluation_model = question.get("evaluation_model")

          if not evaluation_model:
              print("Evaluation method missing.")
              raise SystemExit(1)

          method_id = evaluation_model["method_id"]
          method_version = evaluation_model["version"]

          if method_id not in known:
              print(f"Unknown evaluation method: {method_id}")
              raise SystemExit(1)

          if method_version != known[method_id]:
              print(
                  f"Unsupported method version: "
                  f"{method_id} {method_version}"
              )
              raise SystemExit(1)

          print(
              "EVALUATION METHOD VALIDATION: PASSED "
              f"({method_id} v{method_version})"
          )
          PY

      - name: Validate Baseline Semantics
        env:
          QUESTION_FILE: ${{ steps.generated.outputs.file }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          question = json.loads(
              Path(os.environ["QUESTION_FILE"]).read_text(
                  encoding="utf-8"
              )
          )

          hypothesis = question["hypothesis"].lower()
          method_id = question["evaluation_model"]["method_id"]

          baseline_terms = [
              "baseline",
              "linha de base",
              "linha-base",
              "personal baseline"
          ]

          mentions_baseline = any(
              term in hypothesis
              for term in baseline_terms
          )

          if mentions_baseline and method_id != "method_baseline_deviation":
              print(
                  "SEMANTIC VALIDATION: FAILED"
              )
              print(
                  "Hypothesis references a baseline but does not use "
                  "method_baseline_deviation."
              )
              raise SystemExit(1)

          print("BASELINE SEMANTIC VALIDATION: PASSED")
          PY

      - name: Show generated question
        env:
          QUESTION_FILE: ${{ steps.generated.outputs.file }}
        run: cat "$QUESTION_FILE"

      - name: Commit approved hypothesis
        env:
          QUESTION_FILE: ${{ steps.generated.outputs.file }}
        run: |
          git config user.name "PyHok Agent Generator"
          git config user.email "actions@github.com"

          git add "$QUESTION_FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "ai: generate observational hypothesis"
          git push
