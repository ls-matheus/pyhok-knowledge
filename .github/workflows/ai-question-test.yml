name: AI Question Generator Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-question:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r generator/requirements.txt

      - name: Generate hypothesis with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: python generator/generate_question.py

      - name: Display generated result
        run: cat generator/output/generated_question.json
