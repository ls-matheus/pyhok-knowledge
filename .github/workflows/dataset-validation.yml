name: PyHok Dataset Validation

on:
  push:
    paths:
      - "dataset/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - "dataset/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dataset tests
        run: bash tests/run_dataset_tests.sh
