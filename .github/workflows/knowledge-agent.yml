name: PyHok Knowledge Agent

on:
  schedule:
    - cron: "0,30 8-19 * * *"
      timezone: "America/Sao_Paulo"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pyhok-knowledge-agent
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install google-genai jsonschema

      - name: Check evolution window
        run: |
          python scheduler/window_guard.py

      - name: Build repository context
        run: |
          python generator/build_context.py

      - name: Audit knowledge graph
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          python generator/run_audit.py

      - name: Generate proposal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          python generator/run_proposal.py

      - name: Stop when there is no useful proposal
        run: |
          STATUS=$(python - <<'PY'
          import json

          data = json.load(
              open("generator/output/proposal.json")
          )

          print(data.get("status", "UNKNOWN"))
          PY
          )

          if [ "$STATUS" = "NO_PROPOSAL" ]; then
            echo "No useful evolution found."
            exit 0
          fi

      - name: Validate proposal before branch creation
        run: |
          python validators/validate_proposal.py

      - name: Publish proposal into working tree
        run: |
          python validators/publish_proposal.py

      - name: Create evolution branch
        id: branch
        run: |
          BRANCH="agent/evolution-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

        - name: Commit proposed knowledge
          id: commit
          run: |
            git config user.name "PyHok Knowledge Agent"
            git config user.email "actions@github.com"

            git add -A

            if git diff --cached --quiet; then
              echo "No knowledge changes were produced by the proposal."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "agent: propose knowledge evolution"
            git push origin "${{ steps.branch.outputs.name }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"

        - name: Create pull request
          if: ${{ steps.commit.outputs.changed == 'true' }}
          env:
            GH_TOKEN: ${{ github.token }}
            BRANCH: ${{ steps.branch.outputs.name }}
          run: |
            cat > /tmp/pr_body.md <<'EOF'
            Automated knowledge proposal generated by the PyHok Knowledge Agent.

            This branch MUST pass the full repository validation pipeline before merging.

            The agent has no direct authority over main.
            EOF

            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Agent Evolution: proposed knowledge update" \
              --body-file /tmp/pr_body.md
