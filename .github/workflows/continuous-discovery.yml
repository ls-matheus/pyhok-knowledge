name: PyHok Continuous Epistemic Discovery Engine (7/0)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pyhok-continuous-discovery
  cancel-in-progress: false

jobs:
  continuous-discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install jsonschema pytest google-genai

      - name: Execute Continuous Discovery Engine (force 10 cycles)
        run: |
          python scheduler/continuous_engine.py --max-cycles 10 --force --skip-git

      - name: Show generated theses summary
        run: |
          python scheduler/continuous_engine.py --status

      - name: Show theses JSON
        run: |
          python scheduler/continuous_engine.py --show-theses | python3 -c "
import sys, json
data = json.load(sys.stdin)
print(f'Total theses generated: {data["total_theses"]}')
for t in data['theses'][-5:]:
    print(f'  [{t["thesis_id"]}] {t["opportunity_type"]} => {t["decision"]}')
" || echo "No theses file yet"

      - name: Verify Quality Gates
        run: |
          python scheduler/quality_gate.py

      - name: Commit and Publish Generated Theses and Ledgers
        run: |
          git config user.name "PyHok Discovery Bot"
          git config user.email "bot@pyhok.org"

          git add -A generator/output/ data/theses/ evolution/ledger.jsonl evolution/rejected_claims.jsonl scheduler/checkpoint.json scheduler/status.json

          if git diff --cached --quiet; then
            echo "No new theses or state changes to commit — nothing new was generated."
            exit 0
          fi

          THESES_COUNT=$(python3 -c "
import json, pathlib
f = pathlib.Path('generator/output/theses.json')
data = json.loads(f.read_text()) if f.exists() else {}
print(data.get('total_theses', 0))
" 2>/dev/null || echo "?")

          git commit -m "chore(discovery): publish ${THESES_COUNT} epistemic theses [skip ci]"
          git push origin main
          echo "Theses successfully published to GitHub!"
