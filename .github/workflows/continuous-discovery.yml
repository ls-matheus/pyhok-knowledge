name: PyHok Continuous Epistemic Discovery Engine (7/0)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "generator/output/**"
      - "data/theses/**"
      - "evolution/ledger.jsonl"
      - "evolution/rejected_claims.jsonl"
      - "scheduler/checkpoint.json"
      - "scheduler/status.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: pyhok-continuous-discovery
  cancel-in-progress: false

jobs:
  continuous-discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema pytest google-genai

      - name: Verify Gemini API secret and reset stale circuit breaker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not available to this workflow."
            exit 1
          fi
          python3 -c "from scheduler.state import reset_circuit_breaker; reset_circuit_breaker()"

      - name: Run discovery cycle with model fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PRIMARY_MODEL: ${{ vars.GEMINI_PRIMARY_MODEL || 'gemini-3.6-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          run_model() {
            local model="$1"
            echo "Trying Gemini model: ${model}"
            GEMINI_MODEL="$model" python scheduler/continuous_engine.py --max-cycles 1 --force --skip-git
          }

          primary_exit=0
          run_model "$GEMINI_PRIMARY_MODEL" || primary_exit=$?
          if [ "$primary_exit" -eq 0 ] && python3 -c "import json; s=json.load(open('scheduler/status.json')); raise SystemExit(0 if s.get('status') == 'IDLE' else 1)"; then
            echo "Discovery cycle completed with ${GEMINI_PRIMARY_MODEL}."
          else
            echo "Primary model failed; resetting circuit breaker and trying ${GEMINI_FALLBACK_MODEL}."
            python3 -c "from scheduler.state import reset_circuit_breaker; reset_circuit_breaker()"
            fallback_exit=0
            run_model "$GEMINI_FALLBACK_MODEL" || fallback_exit=$?
            if [ "$fallback_exit" -ne 0 ]; then
              exit "$fallback_exit"
            fi
            python3 -c "import json; s=json.load(open('scheduler/status.json')); raise SystemExit(0 if s.get('status') == 'IDLE' else 1)"
          fi

      - name: Print observability dashboard
        run: python scheduler/continuous_engine.py --status

      - name: Show validated and rejected theses breakdown
        run: |
          python scheduler/continuous_engine.py --show-theses | python3 -c "import sys,json; d=json.load(sys.stdin); c=d.get('counts', {}); print(f\"Total: {d.get('total_theses', 0)} | Validated: {c.get('validated', 0)} | Rejected: {c.get('rejected', 0)} | Quarantined: {c.get('quarantined', 0)}\")"
        continue-on-error: true

      - name: Generate human-readable run summary
        if: always()
        run: python3 scripts/summarize_discovery_run.py | tee analysis/run_summary_console.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload human-readable run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyhok-discovery-summary-${{ github.run_number }}
          path: |
            analysis/run_summary.md
            analysis/run_summary_console.txt
            analysis/artifacts/
          retention-days: 90

      - name: Verify quality gates
        run: python scheduler/quality_gate.py

      - name: Commit and publish theses and summaries to GitHub
        run: |
          git config user.name "PyHok Discovery Bot"
          git config user.email "bot@pyhok.org"
          git add -A analysis/artifacts/ generator/output/ data/theses/ evolution/ledger.jsonl evolution/rejected_claims.jsonl scheduler/checkpoint.json scheduler/status.json || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          MSG=$(python3 -c "import json,pathlib; f=pathlib.Path('generator/output/theses.json'); d=json.loads(f.read_text()) if f.exists() else {}; c=d.get('counts', {}); print(f\"{d.get('total_theses',0)} theses ({c.get('validated',0)} validated, {c.get('rejected',0)} rejected)\")" 2>/dev/null || echo "theses")
          git commit -m "chore(discovery): publish ${MSG} [skip ci]"
          git push origin main
          echo "Published ${MSG} to GitHub successfully."
