name: PyHok Continuous Epistemic Discovery Engine (7/0)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "generator/output/**"
      - "data/theses/**"
      - "evolution/ledger.jsonl"
      - "evolution/rejected_claims.jsonl"
      - "scheduler/checkpoint.json"
      - "scheduler/status.json"

permissions:
  contents: write

concurrency:
  group: pyhok-continuous-discovery
  cancel-in-progress: false

jobs:
  continuous-discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Skip if another run is already in progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUNNING=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "continuous-discovery.yml" --status in_progress --json databaseId --jq "length")
          QUEUED=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "continuous-discovery.yml" --status queued --json databaseId --jq "length")
          TOTAL=$(( RUNNING + QUEUED ))
          echo "in_progress=$RUNNING  queued=$QUEUED  total_active=$TOTAL"
          if [ "$TOTAL" -gt 1 ]; then
            echo "::warning::Another run is active ($RUNNING in_progress, $QUEUED queued). Skipping to avoid overlap."
            exit 0
          fi
          echo "No concurrent run detected. Proceeding."

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema pytest google-genai

      - name: Run 10 continuous epistemic discovery cycles
        run: python scheduler/continuous_engine.py --max-cycles 10 --force --skip-git

      - name: Print observability dashboard
        run: python scheduler/continuous_engine.py --status

      - name: Show last 5 generated theses
        run: python scheduler/continuous_engine.py --show-theses | python3 -c "import sys,json; d=json.load(sys.stdin); [print(f'  [{t[\"thesis_id\"]}] {t[\"opportunity_type\"]} => {t[\"decision\"]}') for t in d['theses'][-5:]]"
        continue-on-error: true

      - name: Verify quality gates
        run: python scheduler/quality_gate.py

      - name: Commit and publish theses to GitHub
        run: |
          git config user.name "PyHok Discovery Bot"
          git config user.email "bot@pyhok.org"
          git add -A generator/output/ data/theses/ evolution/ledger.jsonl evolution/rejected_claims.jsonl scheduler/checkpoint.json scheduler/status.json || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          COUNT=$(python3 -c "import json,pathlib; f=pathlib.Path('generator/output/theses.json'); d=json.loads(f.read_text()) if f.exists() else {}; print(d.get('total_theses',0))" 2>/dev/null || echo "?")
          git commit -m "chore(discovery): publish ${COUNT} epistemic theses [skip ci]"
          git push origin main
          echo "Published ${COUNT} theses to GitHub."
